[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-leworldmodel"
version = "0.1.0"
description = "LeWorldModel from Gymnasium pixels, with CEM model predictive control"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch",
  "gymnasium[classic-control]==1.1.1",
  "transformers==4.49.0", "einops==0.8.1",
  "numpy>=1.26,<3", "Pillow>=10,<12", "tqdm>=4.67,<5"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.2"]
video = ["imageio[ffmpeg]>=2.34,<3"]

[project.scripts]
world-model = "world_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"world_model._vendor.lewm" = ["LICENSE", "UPSTREAM.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["src/world_model/_vendor", "tmp*", "pytest-of-root"]
